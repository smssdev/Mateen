name: Website

# Publishes the landing page, the web app (/app/) and the brand guide (/identity/)
# to GitHub Pages: https://smssdev.github.io/Mateen/
#
# Custom domain (e.g. hafiz.smszs.tech): set the repository variable SITE_DOMAIN
# (Settings → Secrets and variables → Actions → Variables), point a DNS CNAME
# record at smssdev.github.io, and enter the same domain under Settings → Pages.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Build
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then
            export BASE=/ VITE_SITE_URL="https://$SITE_DOMAIN/"
          else
            export BASE=/Mateen/ VITE_SITE_URL="https://smssdev.github.io/Mateen/"
          fi
          npm run build
          cp dist/index.html dist/404.html
          if [ -n "$SITE_DOMAIN" ]; then echo "$SITE_DOMAIN" > dist/CNAME; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
